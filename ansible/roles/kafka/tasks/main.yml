
---
# Task 1: Install Java, archive utilities and AWS CLI.
- name: Install required packages
  ansible.builtin.dnf:
    name:
      - java-21-amazon-corretto-headless
      - tar
      - gzip
      - awscli-2
    state: present
    update_cache: true

# Task 2: Create Kafka installation directory.
- name: Create Kafka installation directory
  ansible.builtin.file:
    path: "{{ kafka_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Task 3: Check cached archive and download it when missing.
- name: Check cached Kafka archive
  ansible.builtin.stat:
    path: "/tmp/kafka_{{ kafka_version }}.tgz"
    checksum_algorithm: sha256
  register: kafka_archive_cache
  delegate_to: localhost
  become: false
  run_once: true

- name: Download Kafka archive on Jenkins controller
  ansible.builtin.get_url:
    url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_2.13-{{ kafka_version }}.tgz"
    dest: "/tmp/kafka_{{ kafka_version }}.tgz"
    mode: "0644"
    timeout: 300
    force: false
  delegate_to: localhost
  become: false
  run_once: true
  register: kafka_download_result
  retries: 3
  delay: 10
  until: kafka_download_result is succeeded
  when: not kafka_archive_cache.stat.exists

# Task 4: Validate archive and calculate its SHA-256 checksum.
- name: Inspect Kafka archive on Jenkins controller
  ansible.builtin.stat:
    path: "/tmp/kafka_{{ kafka_version }}.tgz"
    checksum_algorithm: sha256
  register: kafka_archive_file
  delegate_to: localhost
  become: false
  run_once: true

- name: Validate Kafka archive
  ansible.builtin.assert:
    that:
      - kafka_archive_file.stat.exists
      - kafka_archive_file.stat.isreg
      - kafka_archive_file.stat.size | int > 0
      - kafka_archive_file.stat.checksum is defined
    fail_msg: "Kafka archive is missing, empty or cannot be checksummed."
  run_once: true

# Task 5: Upload archive to the dedicated S3 transfer bucket.
- name: Upload Kafka archive to S3
  ansible.builtin.command:
    argv:
      - aws
      - s3
      - cp
      - "/tmp/kafka_{{ kafka_version }}.tgz"
      - "s3://{{ ssm_transfer_bucket }}/kafka/kafka_2.13-{{ kafka_version }}.tgz"
      - --region
      - "{{ aws_region }}"
      - --sse
      - AES256
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true

# Task 6: Download archive on EC2 and verify its checksum.
- name: Download Kafka archive from S3
  ansible.builtin.command:
    argv:
      - aws
      - s3
      - cp
      - "s3://{{ ssm_transfer_bucket }}/kafka/kafka_2.13-{{ kafka_version }}.tgz"
      - "/tmp/kafka_{{ kafka_version }}.tgz"
      - --region
      - "{{ aws_region }}"
  register: kafka_s3_download
  become: true

- name: Calculate remote Kafka archive checksum
  ansible.builtin.command:
    argv:
      - sha256sum
      - "/tmp/kafka_{{ kafka_version }}.tgz"
  register: kafka_remote_checksum
  changed_when: false
  become: true

- name: Verify Kafka archive integrity
  ansible.builtin.assert:
    that:
      - kafka_remote_checksum.stdout.split()[0] == kafka_archive_file.stat.checksum
    fail_msg: "Kafka archive checksum mismatch. Extraction stopped."

# Task 7: Extract verified Kafka archive.
- name: Extract Kafka archive
  ansible.builtin.unarchive:
    src: "/tmp/kafka_{{ kafka_version }}.tgz"
    dest: "{{ kafka_install_dir }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
    creates: "{{ kafka_install_dir }}/bin/kafka-server-start.sh"

# Task 8: Create Kafka group.
- name: Create Kafka group
  ansible.builtin.group:
    name: kafka
    system: true
    state: present

# Task 9: Create Kafka user.
- name: Create Kafka user
  ansible.builtin.user:
    name: kafka
    group: kafka
    system: true
    shell: /sbin/nologin
    home: "{{ kafka_data_dir }}"
    create_home: false
    state: present

# Task 10: Create Kafka data directory.
- name: Create Kafka data directory
  ansible.builtin.file:
    path: "{{ kafka_data_dir }}"
    state: directory
    owner: kafka
    group: kafka
    mode: "0750"

# Task 11: Create Kafka logs directory with correct ownership.
- name: Set Kafka logs directory ownership
  ansible.builtin.file:
    path: "{{ kafka_install_dir }}/logs"
    state: directory
    owner: kafka
    group: kafka
    mode: "0755"

# Task 12: Configure Kafka KRaft server properties.
- name: Configure Kafka KRaft server properties
  ansible.builtin.template:
    src: server.properties.j2
    dest: "{{ kafka_install_dir }}/config/kraft/server.properties"
    owner: root
    group: kafka
    mode: "0640"
  notify: Restart Kafka

# Task 13: Check whether KRaft storage is initialized.
- name: Check Kafka storage metadata
  ansible.builtin.stat:
    path: "{{ kafka_data_dir }}/meta.properties"
  register: kafka_storage_metadata

# Task 14: Generate cluster ID only for new storage.
- name: Generate Kafka cluster ID
  ansible.builtin.command:
    argv:
      - "{{ kafka_install_dir }}/bin/kafka-storage.sh"
      - random-uuid
  register: kafka_cluster_id
  changed_when: false
  when: not kafka_storage_metadata.stat.exists

# Task 15: Format KRaft storage only when required.
- name: Format Kafka storage
  ansible.builtin.command:
    argv:
      - "{{ kafka_install_dir }}/bin/kafka-storage.sh"
      - format
      - --cluster-id
      - "{{ kafka_cluster_id.stdout }}"
      - --config
      - "{{ kafka_install_dir }}/config/kraft/server.properties"
  become: true
  become_user: kafka
  when: not kafka_storage_metadata.stat.exists

# Task 16: Install Kafka systemd service.
- name: Install Kafka systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/kafka.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Apache Kafka Server
      After=network.target

      [Service]
      Type=simple
      User=kafka
      Group=kafka
      WorkingDirectory={{ kafka_install_dir }}
      Environment="KAFKA_HEAP_OPTS=-Xms512M -Xmx512M"
      ExecStart={{ kafka_install_dir }}/bin/kafka-server-start.sh {{ kafka_install_dir }}/config/kraft/server.properties
      Restart=on-failure
      RestartSec=5
      LimitNOFILE=100000

      [Install]
      WantedBy=multi-user.target
  notify: Restart Kafka

# Task 17: Reload systemd and enable/start Kafka.
- name: Enable and start Kafka
  ansible.builtin.systemd_service:
    name: kafka
    enabled: true
    state: started
    daemon_reload: true
