
---
# Task 1: Install Java and required utilities.
- name: Install required packages
  ansible.builtin.dnf:
    name:
      - java-21-amazon-corretto-headless
      - tar
      - gzip
    state: present
    update_cache: true

# Task 2: Create Kafka installation directory.
- name: Create Kafka installation directory
  ansible.builtin.file:
    path: "{{ kafka_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Task 3: Download Kafka archive.
- name: Download Kafka archive
  ansible.builtin.get_url:
    url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_2.13-{{ kafka_version }}.tgz"
    dest: "/tmp/kafka_{{ kafka_version }}.tgz"
    mode: "0644"

# Task 4: Extract Kafka.
- name: Extract Kafka archive
  ansible.builtin.unarchive:
    src: "/tmp/kafka_{{ kafka_version }}.tgz"
    dest: "{{ kafka_install_dir }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
    creates: "{{ kafka_install_dir }}/bin/kafka-server-start.sh"

# Task 5: Create Kafka group.
- name: Create Kafka group
  ansible.builtin.group:
    name: kafka
    system: true
    state: present

# Task 6: Create Kafka user.
- name: Create Kafka user
  ansible.builtin.user:
    name: kafka
    group: kafka
    system: true
    shell: /sbin/nologin
    home: "{{ kafka_data_dir }}"
    create_home: false
    state: present

# Task 7: Create Kafka data directory.
- name: Create Kafka data directory
  ansible.builtin.file:
    path: "{{ kafka_data_dir }}"
    state: directory
    owner: kafka
    group: kafka
    mode: "0750"

# Task 8: Create Kafka runtime logs directory.
- name: Create Kafka runtime logs directory
  ansible.builtin.file:
    path: "{{ kafka_install_dir }}/logs"
    state: directory
    owner: kafka
    group: kafka
    mode: "0755"

# Task 9: Apply the actual KRaft configuration template.
- name: Configure Kafka KRaft server properties
  ansible.builtin.template:
    src: server.properties.j2
    dest: "{{ kafka_install_dir }}/config/kraft/server.properties"
    owner: root
    group: kafka
    mode: "0640"
  notify: Restart Kafka

# Task 10: Check whether Kafka storage is initialized.
- name: Check Kafka storage metadata
  ansible.builtin.stat:
    path: "{{ kafka_data_dir }}/meta.properties"
  register: kafka_storage_metadata

# Task 11: Generate a cluster ID only for new storage.
- name: Generate Kafka cluster ID
  ansible.builtin.command:
    argv:
      - "{{ kafka_install_dir }}/bin/kafka-storage.sh"
      - random-uuid
  register: kafka_cluster_id
  changed_when: false
  when: not kafka_storage_metadata.stat.exists

# Task 12: Format Kafka storage for KRaft.
- name: Format Kafka storage
  ansible.builtin.command:
    argv:
      - "{{ kafka_install_dir }}/bin/kafka-storage.sh"
      - format
      - --cluster-id
      - "{{ kafka_cluster_id.stdout }}"
      - --config
      - "{{ kafka_install_dir }}/config/kraft/server.properties"
  become_user: kafka
  when: not kafka_storage_metadata.stat.exists

# Task 13: Install Kafka systemd service.
- name: Install Kafka systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/kafka.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Apache Kafka Server
      After=network.target

      [Service]
      Type=simple
      User=kafka
      Group=kafka
      WorkingDirectory={{ kafka_install_dir }}
      Environment="KAFKA_HEAP_OPTS=-Xms512M -Xmx512M"
      ExecStart={{ kafka_install_dir }}/bin/kafka-server-start.sh {{ kafka_install_dir }}/config/kraft/server.properties
      ExecStop={{ kafka_install_dir }}/bin/kafka-server-stop.sh
      Restart=on-failure
      RestartSec=5
      LimitNOFILE=100000

      [Install]
      WantedBy=multi-user.target
  notify: Restart Kafka

# Task 14: Enable and start Kafka.
- name: Enable and start Kafka
  ansible.builtin.systemd_service:
    name: kafka
    enabled: true
    state: started
    daemon_reload: true
