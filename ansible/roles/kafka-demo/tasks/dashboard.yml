
---
# Install Docker using the Amazon Linux package manager.
- name: Install Docker
  ansible.builtin.dnf:
    name: docker
    state: present
    update_cache: true

# Start Docker automatically.
- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

# Download the Kafka UI image.
- name: Pull Kafka UI image
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - "{{ kafka_ui_image }}"
  register: kafka_ui_pull
  changed_when: >
    'Downloaded newer image' in
    (kafka_ui_pull.stdout ~ kafka_ui_pull.stderr) or
    'Pull complete' in
    (kafka_ui_pull.stdout ~ kafka_ui_pull.stderr)

# Remove the existing container so updated settings can be applied.
- name: Remove existing Kafka UI container
  ansible.builtin.command:
    argv:
      - docker
      - rm
      - --force
      - "{{ kafka_ui_container_name }}"
  register: kafka_ui_remove
  changed_when: kafka_ui_remove.rc == 0
  failed_when: false

# Start Kafka UI with environment-based configuration.
- name: Start Kafka UI container
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --detach
      - --name
      - "{{ kafka_ui_container_name }}"
      - --restart
      - unless-stopped
      - --publish
      - "127.0.0.1:{{ kafka_ui_port }}:8080"
      - --env
      - "DYNAMIC_CONFIG_ENABLED=false"
      - --env
      - "KAFKA_CLUSTERS_0_NAME=kafka-demo"
      - --env
      - "KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS={{ kafka_advertised_host }}:{{ kafka_port }}"
      - "{{ kafka_ui_image }}"
  register: kafka_ui_run
  changed_when: true

# Verify that the container is running.
- name: Verify Kafka UI container is running
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.State.Running{{ '}}' }}"
      - "{{ kafka_ui_container_name }}"
  register: kafka_ui_status
  changed_when: false
  retries: 12
  delay: 5
  until: kafka_ui_status.rc == 0 and
         (kafka_ui_status.stdout | trim) == "true"
