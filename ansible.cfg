
[defaults]
# Use the inventory file inside the Ansible directory.
inventory = ./ansible/inventory.ini

# Disable SSH host-key prompts because the connection uses SSM.
host_key_checking = False

# Use the project directory for roles.
roles_path = ./ansible/roles

# Use /tmp for remote Ansible temporary files.
remote_tmp = /tmp/.ansible/tmp

[connection]
# Keep connection operations from timing out too quickly.
pipelining = False
